<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
  >
    <div class="brand">
      <span class="logo"><mat-icon>deployed_code</mat-icon></span>
      <div>
        <strong>{{ 'app.title' | translate }}</strong>
        <small>{{ 'app.subtitle' | translate }}</small>
      </div>
    </div>

    <mat-nav-list>
      @for (link of links; track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          (click)="isMobile() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isMobile()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>

      <button
        mat-button
        class="lang"
        (click)="language.toggle()"
        [matTooltip]="'common.language' | translate"
      >
        <mat-icon>translate</mat-icon>
        {{ language.current() === 'en' ? 'ES' : 'EN' }}
      </button>

      <button mat-icon-button (click)="theme.toggle()" [matTooltip]="'common.theme' | translate">
        <mat-icon>{{ theme.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user">
        <span class="avatar">{{ initials() }}</span>
        <span class="user-name">{{ auth.user()?.name }}</span>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="menu-header">
          <strong>{{ auth.user()?.email }}</strong>
          <span class="chip neutral">{{ auth.user()?.role }}</span>
        </div>
        <button mat-menu-item (click)="auth.logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'common.logout' | translate }}</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
